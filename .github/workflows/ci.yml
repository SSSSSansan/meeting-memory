# Линтер и тесты на каждый PR и push в main. Без ключей: LLM_BACKEND=stub, сеть к моделям не нужна.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — версия из CLAUDE.md, 3.13 — то, что стоит у команды локально
        python-version: ["3.11", "3.13"]
    env:
      LLM_BACKEND: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt ruff==0.17.3
      - name: Lint
        run: ruff check . --output-format github
      - name: Tests
        run: pytest -q
